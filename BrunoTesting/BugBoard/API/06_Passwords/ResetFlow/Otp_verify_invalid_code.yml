info:
  name: Verify_invalid_code
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/password-reset-verifications"
  body:
    type: json
    data: '{"email":"{{email}}","code":"000000"}'
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: tests
      code: |-
        test("OTP verify invalid code handled", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("OTP verify returns valid false", function () {
          const body = res.getBody();
          expect(body.valid).to.equal(false);
        });

settings:
