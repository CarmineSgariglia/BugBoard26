info:
  name: Delete_valid
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{baseURL}}/notifications/{{notify_user_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Delete notification status", function () {
          const notifyUserId = String(bru.getEnvVar("notify_user_id") || "");
          const invalidId = String(bru.getEnvVar("invalid_id") || "999999");
          if (notifyUserId === invalidId) {
            expect(res.getStatus()).to.equal(404);
          } else {
            expect(res.getStatus()).to.equal(204);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
