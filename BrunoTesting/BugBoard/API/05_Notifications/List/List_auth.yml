info:
  name: List_auth
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/notifications"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Notifications list returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Notifications list is paginated", function () {
          const body = res.getBody();
          expect(body).to.be.an("object");
          expect(body).to.have.property("results");
          expect(body.results).to.be.an("array");
          expect(body).to.have.property("nextCursor");
          expect(body).to.have.property("hasMore");
          expect(body).to.have.property("hasUnread");
        });

        test("Notification payload has expected shape when present", function () {
          const body = res.getBody();
          const items = Array.isArray(body?.results) ? body.results : [];

          if (items.length === 0) {
            return;
          }

          const item = items[0];
          expect(item).to.have.property("notifyUserId");
          expect(item).to.have.property("notificationId");
          expect(item).to.have.property("type");
          expect(item).to.have.property("createdAt");
          expect(item).to.have.property("issueId");
          expect(item).to.have.property("projectId");
          expect(item).to.have.property("isRead");
          expect(item).to.have.property("readAt");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
