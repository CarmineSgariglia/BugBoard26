info:
  name: Set_notification_context
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/notifications"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        let notificationId = bru.getEnvVar("invalid_id") || "999999";

        if (Array.isArray(body) && body.length > 0 && body[0].notifyUserId) {
          notificationId = String(body[0].notifyUserId);
        }

        bru.setVar("notification_id", notificationId);
        bru.setEnvVar("notification_id", notificationId);
    - type: tests
      code: |-
        test("Notification setup status", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
