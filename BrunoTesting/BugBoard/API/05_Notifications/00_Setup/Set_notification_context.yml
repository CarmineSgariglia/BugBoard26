info:
  name: Set_notification_context
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/notifications"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const items = Array.isArray(body?.results) ? body.results : [];

        if (items.length > 0 && items[0].notifyUserId) {
          const notifyUserId = String(items[0].notifyUserId);
          bru.setVar("notify_user_id", notifyUserId);
          bru.setEnvVar("notify_user_id", notifyUserId);
        }
    - type: tests
      code: |-
        test("Notification setup status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Notification setup response is paginated", function () {
          const body = res.getBody();
          expect(body).to.be.an("object");
          expect(body).to.have.property("results");
          expect(body.results).to.be.an("array");
          expect(body).to.have.property("nextCursor");
          expect(body).to.have.property("hasMore");
          expect(body).to.have.property("hasUnread");
        });

        test("Notification setup resolved a valid notify_user_id", function () {
          const notifyUserId = bru.getEnvVar("notify_user_id");
          expect(notifyUserId).to.be.a("string");
          expect(notifyUserId).to.not.equal("");
          expect(notifyUserId).to.not.equal(String(bru.getEnvVar("invalid_id") || "999999"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
