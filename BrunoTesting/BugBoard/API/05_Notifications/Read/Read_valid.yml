info:
  name: Read_valid
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/notifications/{{notify_user_id}}/read"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Read single notification status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Read single notification marks as read", function () {
          const body = res.getBody();
          expect(body.notifyUserId).to.equal(Number(bru.getEnvVar("notify_user_id")));
          expect(body.isRead).to.equal(true);
        });

        test("Read single notification response shape", function () {
          const body = res.getBody();
          expect(body).to.have.property("notificationId");
          expect(body).to.have.property("type");
          expect(body).to.have.property("createdAt");
          expect(body).to.have.property("issueId");
          expect(body).to.have.property("projectId");
          expect(body).to.have.property("readAt");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
