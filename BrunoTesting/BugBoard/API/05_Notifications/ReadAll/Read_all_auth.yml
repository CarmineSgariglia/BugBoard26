info:
  name: ReadAll_auth
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseURL}}/notifications"
  body:
    type: json
    data:
      - name: isRead
        type: boolean
        value: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Read all notifications returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Read all notifications returns updated counter", function () {
          const body = res.getBody();
          expect(body).to.have.property("updated");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
