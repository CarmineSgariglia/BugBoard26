info:
  name: Update_no_auth
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseURL}}/notifications/{{notify_user_id}}"
  body:
    type: json
    data: '{"isRead":true}'
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "");
        req.setHeader("X-CSRFToken", "");
    - type: tests
      code: |-
        test("Update without auth rejected", function () {
          expect([401, 404]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
