  body:
    type: multipart-form
    data:
      - name: title
        type: text
        value: no auth issue
      - name: description
        type: text
        value: unauthenticated issue create attempt
      - name: type
        type: text
        value: BUG
      - name: status
        type: text
        value: TODO
