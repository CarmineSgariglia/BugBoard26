info:
  name: Issues_list_auth
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/projects/{{project_id}}/issues"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Project issues list returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Issues list response is array", function () {
          expect(res.getBody()).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
