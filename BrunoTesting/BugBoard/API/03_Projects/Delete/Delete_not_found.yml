info:
  name: Delete_not_found
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseURL}}/projects/{{invalid_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Delete invalid project returns role-correct status", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(404);
          } else {
            expect(res.getStatus()).to.equal(403);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
