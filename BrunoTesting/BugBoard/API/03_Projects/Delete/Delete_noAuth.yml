info:
  name: Delete_noAuth
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseURL}}/projects/{{project_id}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "");
    - type: tests
      code: |-
        test("Delete without auth is rejected", function () {
          expect([401, 403]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
