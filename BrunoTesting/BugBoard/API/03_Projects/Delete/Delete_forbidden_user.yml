info:
  name: Delete_forbidden_user
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseURL}}/projects/{{project_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Delete by non-admin is forbidden", function () {
          const email = bru.getEnvVar("email") || "";
          const status = res.getStatus();
          if (email.includes("admin")) {
            expect(status).to.equal(204);
          } else {
            expect(status).to.equal(403);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
