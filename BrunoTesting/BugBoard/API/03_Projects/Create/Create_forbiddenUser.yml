info:
  name: Create_forbiddenUser
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/projects"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: forbidden project
      - name: description
        type: text
        value: should be forbidden for developer
      - name: color
        type: text
        value: "#3dff81"
      - name: icon
        type: text
        value: connectdevelop
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Create by non-admin is forbidden", function () {
          const email = bru.getEnvVar("email") || "";
          const status = res.getStatus();
          if (email.includes("admin")) {
            expect(status).to.equal(201);
          } else {
            expect([403, 404]).to.include(status);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
