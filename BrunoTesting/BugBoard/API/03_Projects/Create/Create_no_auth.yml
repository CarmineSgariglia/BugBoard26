info:
  name: Create_no_auth
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/projects"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: no auth project
      - name: description
        type: text
        value: unauthenticated create attempt
      - name: color
        type: text
        value: "#3dff81"
      - name: icon
        type: text
        value: connectdevelop
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "");
    - type: tests
      code: |-
        test("Create without auth is rejected", function () {
          expect([401, 403]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
