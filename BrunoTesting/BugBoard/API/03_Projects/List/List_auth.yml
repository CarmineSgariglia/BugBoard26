info:
  name: List_auth
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/projects"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response is array", function () {
          const body = res.getBody();
          expect(body).to.be.an("array");
        });

        test("Project shape is valid when present", function () {
          const body = res.getBody();
          if (body.length > 0) {
            expect(body[0]).to.have.property("projectId");
            expect(body[0]).to.have.property("name");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
