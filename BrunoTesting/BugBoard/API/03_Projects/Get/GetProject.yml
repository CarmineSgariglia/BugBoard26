info:
  name: GetProject
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/projects/{{project_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Get project returns 200 for member/admin", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Correct project returned", function () {
          const body = res.getBody();
          expect(String(body.projectId)).to.equal(String(bru.getEnvVar("project_id") || bru.getVar("project_id")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
