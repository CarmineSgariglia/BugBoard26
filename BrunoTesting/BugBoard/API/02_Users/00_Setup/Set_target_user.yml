info:
  name: Set_target_user
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/users"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const currentUserId = String(bru.getEnvVar("current_user_id") || "");

        let targetId = null;

        if (body?.results && Array.isArray(body.results) && body.results.length > 0) {
          const notMe = body.results.find(u => String(u.userId) !== currentUserId);
          targetId = String((notMe || body.results[0]).userId);
        }

        if (targetId) {
          bru.setVar("target_user_id", targetId);
          bru.setEnvVar("target_user_id", targetId);
        }
    - type: tests
      code: |-
        test("Users list setup reachable", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Target user id resolved", function () {
          const targetId = bru.getEnvVar("target_user_id");
          expect(targetId).to.be.a("string");
          expect(targetId).to.not.equal("");
          expect(targetId).to.not.equal(String(bru.getEnvVar("current_user_id") || ""));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
