info:
  name: Set_target_user
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/users"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const email = bru.getEnvVar("email") || "";

        let targetId = bru.getEnvVar("invalid_id") || "999999";

        if (body?.results && Array.isArray(body.results) && body.results.length > 0) {
          if (email.includes("admin")) {
            const notMe = body.results.find(u => String(u.userId) !== String(bru.getEnvVar("current_user_id")));
            targetId = String((notMe || body.results[0]).userId);
          } else {
            targetId = String(body.results[0].userId);
          }
        }

        bru.setVar("target_user_id", targetId);
        bru.setEnvVar("target_user_id", targetId);
    - type: tests
      code: |-
        test("Users list setup reachable", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
