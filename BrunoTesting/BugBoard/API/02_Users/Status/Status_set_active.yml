http:
  method: POST
  url: "{{baseURL}}/users/3/status"
  body:
    type: json
    data: '{"active" : true}'
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Set user status role aware", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(200);
          } else {
            expect(res.getStatus()).to.equal(403);
          }
        });

settings:
