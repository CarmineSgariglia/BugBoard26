info:
  name: Create_role_aware
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/users"
  body:
    type: multipart-form
    data:
      - name: username
        type: text
        value: "bru_user_{{request_ts}}"
      - name: email
        type: text
        value: "bru_user_{{request_ts}}@example.com"
      - name: password
        type: text
        value: StrongPass123!
      - name: group
        type: text
        value: Developer
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("request_ts", Date.now());
    - type: tests
      code: |-
        test("Create user role aware", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(201);
          } else {
            expect([403, 404]).to.include(res.getStatus());
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
