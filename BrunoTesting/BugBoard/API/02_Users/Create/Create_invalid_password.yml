info:
  name: Create_invalid_password
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/users"
  body:
    type: multipart-form
    data:
      - name: username
        type: text
        value: weak_user
      - name: email
        type: text
        value: weak_user@example.com
      - name: password
        type: text
        value: "12345678"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Weak password create rejected for admin or forbidden for dev", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(400);
          } else {
            expect(res.getStatus()).to.equal(403);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
