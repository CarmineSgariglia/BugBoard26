info:
  name: Me_auth
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/users/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body?.userId) {
          const currentUserId = String(body.userId);
          bru.setVar("current_user_id", currentUserId);
          bru.setEnvVar("current_user_id", currentUserId);
        }
    - type: tests
      code: |-
        test("Me returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Me payload has userId", function () {
          const body = res.getBody();
          expect(body).to.have.property("userId");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
