http:
  method: POST
  url: "{{baseURL}}/users/{{current_user_id}}/change-password"
  body:
    type: multipart-form
    data:
      - name: currentPassword
        type: text
        value: wrong-pass
      - name: newPassword
        type: text
        value: NewStrongPass123!
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Wrong current password rejected", function () {
          expect(res.getStatus()).to.equal(400);
        });

settings:
