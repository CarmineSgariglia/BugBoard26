info:
  name: List_auth
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/users"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Users list returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Users list has count/results", function () {
          const body = res.getBody();
          expect(body).to.have.property("count");
          expect(body).to.have.property("results");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
