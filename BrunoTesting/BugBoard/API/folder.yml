info:
  name: API
  type: folder
  seq: 2

request:
  auth: inherit
  scripts:
    - type: before-request
      code: |-
        const token = bru.getEnvVar("access_token");

        if (token) {
          req.setHeader("Authorization", `Bearer ${token}`);
        }

        const method = req.getMethod();
        const methodsRequiringCsrf = ["POST", "PUT", "PATCH", "DELETE"];

        if (methodsRequiringCsrf.includes(method)) {
          const jar = bru.cookies.jar();
          const csrfCookie = await jar.getCookie("{{baseURL}}/security/csrf-token", "csrftoken");

          if (csrfCookie?.value) {
            req.setHeader("X-CSRFToken", csrfCookie.value);
          }
        }
