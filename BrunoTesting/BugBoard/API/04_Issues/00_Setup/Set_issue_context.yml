info:
  name: Set_issue_context
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/projects/{{project_id}}/issues"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (Array.isArray(body) && body.length > 0 && body[0].issueId) {
          const issueId = String(body[0].issueId);
          bru.setVar("issue_id", issueId);
          bru.setEnvVar("issue_id", issueId);
        }
    - type: tests
      code: |-
        test("Issue setup status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Issue setup response is array", function () {
          expect(res.getBody()).to.be.an("array");
        });

        test("Issue setup resolved a valid issue id", function () {
          const issueId = bru.getEnvVar("issue_id");
          expect(issueId).to.be.a("string");
          expect(issueId).to.not.equal("");
          expect(issueId).to.not.equal(String(bru.getEnvVar("invalid_id") || "999999"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
