info:
  name: Set_issue_context
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/projects/{{project_id}}/issues"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        let issueId = bru.getEnvVar("invalid_id") || "999999";

        if (Array.isArray(body) && body.length > 0 && body[0].issueId) {
          issueId = String(body[0].issueId);
        }

        bru.setVar("issue_id", issueId);
        bru.setEnvVar("issue_id", issueId);
    - type: tests
      code: |-
        test("Issue setup status", function () {
          expect([200, 403, 404]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
