info:
  name: Delete_missing_title_confirmation
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{baseURL}}/issues/{{issue_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Issue delete without title confirmation rejected", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(400);
          } else {
            expect(res.getStatus()).to.equal(403);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
