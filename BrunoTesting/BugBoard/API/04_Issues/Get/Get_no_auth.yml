http:
  method: GET
  url: "{{baseURL}}/issues/{{issue_id}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: req.setHeader("Authorization", "");
    - type: tests
      code: |-
        test("Get issue no auth rejected", function () {
          expect([401, 403]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
