info:
  name: Get_auth
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/issues/{{issue_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Get issue auth status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Get issue returns expected shape", function () {
          const body = res.getBody();
          expect(body).to.have.property("issueId");
          expect(body).to.have.property("projectId");
          expect(body).to.have.property("title");
          expect(body).to.have.property("status");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
