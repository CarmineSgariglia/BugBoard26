http:
  method: POST
  url: "{{baseURL}}/issues/{{issue_id}}/status"
  body:
    type: multipart-form
    data:
      - name: status
        type: text
        value: INVALID
      - name: message
        type: text
        value: Invalid status attempt
  auth: inherit

runtime:
