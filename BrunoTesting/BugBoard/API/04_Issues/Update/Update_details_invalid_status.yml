info:
  name: Update_details_invalid_status
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseURL}}/issues/{{issue_id}}"
  body:
    type: multipart-form
    data:
      - name: status
        type: text
        value: INVALID_STATUS
      - name: message
        type: text
        value: Invalid status check
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Invalid issue patch payload rejected", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(400);
          } else {
            expect(res.getStatus()).to.equal(403);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
