info:
  name: Assign_empty_user_ids
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/issues/{{issue_id}}/assign"
  body:
    type: multipart-form
    data:
      - name: userIds
        type: text
        value: "[]"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Assign empty users rejected", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(400);
          } else {
            expect(res.getStatus()).to.equal(403);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
