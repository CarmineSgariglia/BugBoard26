info:
  name: Assign_invalid_user
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseURL}}/issues/{{issue_id}}/assignees/{{invalid_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Assign invalid user rejected for admin and forbidden for developer", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(400);
          } else {
            expect(res.getStatus()).to.equal(403);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
