info:
  name: Subscribe_role_aware
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseURL}}/issues/{{issue_id}}/subscriptions/me"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Issue subscription create is role-aware", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(204);
          } else {
            expect(res.getStatus()).to.equal(403);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
