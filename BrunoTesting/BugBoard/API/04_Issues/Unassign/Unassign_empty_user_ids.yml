info:
  name: Unassign_requires_admin
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{baseURL}}/issues/{{issue_id}}/assignees/{{current_user_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Unassign requires admin and remains idempotent for admin", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(204);
          } else {
            expect(res.getStatus()).to.equal(403);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
