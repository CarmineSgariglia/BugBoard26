info:
  name: Suggestions_get
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/issues/{{issue_id}}/suggestions"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Issue suggestions status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Issue suggestions returns array", function () {
          expect(res.getBody()).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
