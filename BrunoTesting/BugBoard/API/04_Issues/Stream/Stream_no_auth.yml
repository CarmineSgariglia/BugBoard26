info:
  name: Stream_no_auth
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/issues/{{issue_id}}/events/stream"
  headers:
    - name: Accept
      value: text/event-stream
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "");
        req.setHeader("X-CSRFToken", "");
    - type: tests
      code: |-
        test("Issue event stream requires authentication", function () {
          expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
