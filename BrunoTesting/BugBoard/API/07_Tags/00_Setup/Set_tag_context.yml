info:
  name: Set_tag_context
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/tags"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (Array.isArray(body) && body.length > 0 && body[0].tagId) {
          const tagId = String(body[0].tagId);
          bru.setVar("tag_id", tagId);
          bru.setEnvVar("tag_id", tagId);
        }
    - type: tests
      code: |-
        test("Tag setup status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Tag setup response is array", function () {
          expect(res.getBody()).to.be.an("array");
        });

        test("Tag setup resolved a valid tag id", function () {
          const tagId = bru.getEnvVar("tag_id");
          expect(tagId).to.be.a("string");
          expect(tagId).to.not.equal("");
          expect(tagId).to.not.equal(String(bru.getEnvVar("invalid_id") || "999999"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
