info:
  name: Set_tag_context
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/tags"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        let tagId = bru.getEnvVar("invalid_id") || "999999";

        if (Array.isArray(body) && body.length > 0 && body[0].tagId) {
          tagId = String(body[0].tagId);
        }

        bru.setVar("tag_id", tagId);
        bru.setEnvVar("tag_id", tagId);
    - type: tests
      code: |-
        test("Tag setup status", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
