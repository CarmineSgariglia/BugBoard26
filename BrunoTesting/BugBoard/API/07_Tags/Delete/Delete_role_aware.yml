info:
  name: Delete_role_aware
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{baseURL}}/tags/{{tag_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Tag delete role aware", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(204);
          } else {
            expect(res.getStatus()).to.equal(403);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
