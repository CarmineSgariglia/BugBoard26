info:
  name: Create_role_aware
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/tags"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: "bru-tag-{{request_ts}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("request_ts", Date.now());
    - type: tests
      code: |-
        test("Tag create role aware", function () {
          const email = bru.getEnvVar("email") || "";
          if (email.includes("admin")) {
            expect(res.getStatus()).to.equal(201);
          } else {
            expect([403, 404]).to.include(res.getStatus());
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
