info:
  name: Login_valid
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/auth/login"
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: "{{email}}"
      - name: password
        type: text
        value: "{{password}}"
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body?.accessToken) {
          bru.setEnvVar("access_token", body.accessToken, { persist: true });
        }
    - type: tests
      code: |-
        test("Login status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Login returns accessToken", function () {
          const body = res.getBody();
          expect(body).to.have.property("accessToken");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
