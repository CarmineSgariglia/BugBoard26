info:
  name: Set_attachment_context
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/attachments?issueId={{issue_id}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        let attachmentId = bru.getEnvVar("invalid_id") || "999999";

        if (Array.isArray(body) && body.length > 0 && body[0].attachmentId) {
          attachmentId = String(body[0].attachmentId);
        }

        bru.setVar("attachment_id", attachmentId);
        bru.setEnvVar("attachment_id", attachmentId);
    - type: tests
      code: |-
        test("Attachment setup status", function () {
          expect([200, 403, 404]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
