info:
  name: Set_attachment_context
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/issues/{{issue_id}}/attachments"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (Array.isArray(body) && body.length > 0 && body[0].attachmentId) {
          const attachmentId = String(body[0].attachmentId);
          bru.setVar("attachment_id", attachmentId);
          bru.setEnvVar("attachment_id", attachmentId);
        } else {
          const fallbackAttachmentId = String(bru.getEnvVar("invalid_id") || "999999");
          bru.setVar("attachment_id", fallbackAttachmentId);
          bru.setEnvVar("attachment_id", fallbackAttachmentId);
        }
    - type: tests
      code: |-
        test("Attachment setup status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Attachment setup response is array", function () {
          expect(res.getBody()).to.be.an("array");
        });

        test("Attachment setup resolves a usable attachment id for the current dataset", function () {
          const body = res.getBody();
          const attachmentId = bru.getEnvVar("attachment_id");
          expect(attachmentId).to.be.a("string");
          expect(attachmentId).to.not.equal("");
          if (Array.isArray(body) && body.length > 0) {
            expect(attachmentId).to.not.equal(String(bru.getEnvVar("invalid_id") || "999999"));
          } else {
            expect(attachmentId).to.equal(String(bru.getEnvVar("invalid_id") || "999999"));
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
