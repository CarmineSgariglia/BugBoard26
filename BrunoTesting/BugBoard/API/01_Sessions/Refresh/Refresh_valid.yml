info:
  name: Refresh_valid
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/sessions/current/access-token"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body?.accessToken) {
          bru.setEnvVar("access_token", body.accessToken, { persist: true });
        }
    - type: tests
      code: |-
        test("Refresh valid with cookie", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
