info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/sessions"
  body:
    type: json
    data: '{"email":"{{email}}","password":"{{password}}"}'
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: before-request
      code: |-
        const jar = bru.cookies.jar();
        const csrfCookie = await jar.getCookie("{{baseURL}}/security/csrf-token", "csrftoken");

        if (csrfCookie?.value) {
          req.setHeader("X-CSRFToken", csrfCookie.value);
        }
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body?.accessToken) {
          bru.setEnvVar("access_token", body.accessToken, { persist: true });
        }

        if (body?.user?.userId) {
          const currentUserId = String(body.user.userId);
          bru.setVar("current_user_id", currentUserId);
          bru.setEnvVar("current_user_id", currentUserId);
        }
    - type: tests
      code: |-
        test("Login returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Login returns access token and user payload", function () {
          const body = res.getBody();
          expect(body).to.have.property("accessToken");
          expect(body).to.have.property("user");
          expect(body.user).to.have.property("userId");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
