info:
  name: GetCSRF
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/security/csrf-token"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("csrf endpoint returns success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("csrf endpoint returns token payload", function () {
          const body = res.getBody();
          expect(body).to.have.property("csrfToken");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
