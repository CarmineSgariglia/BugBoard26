info:
  name: Me
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/auth/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();


        if (body?.userId !== undefined) {
          bru.setEnvVar("current_user_id", String(body.userId), { persist: true });
        }
    - type: tests
      code: |-
        test("me returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("me returns expected user fields", function () {
          const body = res.getBody();
          expect(body).to.exist;
          expect(body).to.be.an("object");

          expect(
            body.userId !== undefined ||
            body.group !== undefined ||
            body.username !== undefined ||
            body.email !== undefined
          ).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
