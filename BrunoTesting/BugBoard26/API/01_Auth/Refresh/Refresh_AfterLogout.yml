info:
  name: Refresh_AfterLogout
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/api/auth/refresh
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("refresh after logout is rejected", function () {
          expect([401, 403]).to.include(res.getStatus());
        });

        test("refresh after logout returns error body", function () {
          const body = res.getBody();
          expect(body.detail).to.equal("Refresh token missing");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
