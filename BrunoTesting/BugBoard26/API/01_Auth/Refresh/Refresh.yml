info:
  name: Refresh
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/auth/refresh"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body?.accessToken) {
         
          bru.setEnvVar("access_token", body.accessToken, { persist: true });
        }
    - type: tests
      code: |-
        test("refresh returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("refresh returns a new access token", function () {
          expect(res.getBody().accessToken).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
