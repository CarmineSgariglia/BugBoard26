info:
  name: Create_noAuth
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8000/api/projects
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: TestProject4
      - name: description
        type: text
        value: project created with bruno
      - name: color
        type: text
        value: "#3dff81"
      - name: icon
        type: text
        value: connectdevelop
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setVar("project_id", body.projectId);
    - type: tests
      code: |-
        test("Status is 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("Project created", function () {
          const body = res.getBody();
          expect(body).to.have.property("projectId");

        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
