components:
  schemas:
    AdminResetPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 8
      required:
      - newPassword
    Attachment:
      type: object
      properties:
        attachmentId:
          type: integer
          readOnly: true
        updateId:
          type: integer
          readOnly: true
        originalName:
          type: string
          readOnly: true
        path:
          type: string
          maxLength: 256
        url:
          type: string
          readOnly: true
        mimeType:
          type: string
        size:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        uploadedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachmentId
      - mimeType
      - originalName
      - path
      - size
      - updateId
      - uploadedAt
      - url
    CSRFTokenResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
      required:
      - currentPassword
      - newPassword
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    GroupEnum:
      enum:
      - admin
      - developer
      type: string
      description: |-
        * `admin` - Admin
        * `developer` - Developer
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Issue:
      type: object
      properties:
        issueId:
          type: integer
          readOnly: true
        projectId:
          type: integer
          readOnly: true
        reporterId:
          type: integer
          readOnly: true
        reporter:
          allOf:
          - $ref: '#/components/schemas/UserRead'
          readOnly: true
        title:
          type: string
          maxLength: 30
        description:
          type: string
          maxLength: 1000
        type:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/IssueAssignee'
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
      required:
      - assignees
      - createdAt
      - description
      - issueId
      - projectId
      - reporter
      - reporterId
      - tags
      - title
      - type
    IssueAssignee:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
        profileImg:
          type: string
          nullable: true
      required:
      - profileImg
      - userId
      - username
    IssueAttachmentCreateRequestRequest:
      type: object
      properties:
        message:
          type: string
        file:
          type: string
          format: binary
      required:
      - file
    IssueEventAttachmentUploadRequestRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    IssueRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          minLength: 1
          maxLength: 1000
        type:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        assigneeIds:
          type: array
          items:
            type: integer
            minimum: 1
          writeOnly: true
        tagIds:
          type: array
          items:
            type: integer
            minimum: 1
          writeOnly: true
        tagNames:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 16
          writeOnly: true
      required:
      - description
      - title
      - type
    LoginRequestRequest:
