  /api/notifications:
    get:
      operationId: notifications_list
      description: Cursor-based notification feed for the authenticated user.
      parameters:
      - in: query
        name: before
        schema:
          type: integer
      - in: query
        name: limit
        schema:
          type: integer
      tags:
      - Notifications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationsPage'
          description: ''
    patch:
      operationId: notifications_bulk_update
      description: Bulk update notification state for the current user.
      summary: Bulk update notifications
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPatchRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResponse'
          description: ''
  /api/notifications/{notificationId}:
