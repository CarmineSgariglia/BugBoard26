      - csrfToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordOTPVerifyResponse'
          description: ''
  /api/password-resets:
    post:
      operationId: password_resets_create
      description: Completes the OTP-based password reset flow.
      summary: Reset password with OTP
      tags:
      - Passwords
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
