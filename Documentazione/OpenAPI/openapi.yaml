  /api/password-reset-requests:
    post:
      operationId: password_reset_requests_create
      description: Starts the OTP-based password reset flow.
      summary: Request password reset OTP
      tags:
      - Passwords
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOTPRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordOTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordOTPRequestRequest'
        required: true
      security:
      - csrfToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/password-reset-verifications:
    post:
      operationId: password_reset_verifications_create
      description: Validates a password reset OTP.
      summary: Verify password reset OTP
      tags:
