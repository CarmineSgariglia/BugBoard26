components:
  schemas:
    Attachment:
      type: object
      properties:
        attachmentId:
          type: integer
          readOnly: true
        updateId:
          type: integer
          readOnly: true
        originalName:
          type: string
          readOnly: true
        path:
          type: string
          maxLength: 256
        url:
          type: string
          readOnly: true
        mimeType:
          type: string
        size:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        uploadedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachmentId
      - mimeType
      - originalName
      - path
      - size
      - updateId
      - uploadedAt
      - url
    AttachmentCreateRequestRequest:
      type: object
      properties:
        issueId:
          type: integer
        updateId:
          type: integer
        message:
          type: string
        file:
          type: string
          format: binary
      required:
      - file
    CSRFTokenResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    GroupEnum:
      enum:
      - admin
      - developer
      type: string
      description: |-
        * `admin` - Admin
        * `developer` - Developer
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Issue:
      type: object
      properties:
        issueId:
          type: integer
          readOnly: true
        projectId:
          type: integer
          readOnly: true
        reporterId:
          type: integer
          readOnly: true
        reporter:
          allOf:
          - $ref: '#/components/schemas/UserRead'
          readOnly: true
        title:
          type: string
          maxLength: 30
        description:
          type: string
          maxLength: 1000
        type:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/IssueAssignee'
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
      required:
      - assignees
      - createdAt
      - description
      - issueId
      - projectId
      - reporter
      - reporterId
      - tags
      - title
      - type
    IssueAssignee:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
        profileImg:
          type: string
          nullable: true
      required:
      - profileImg
      - userId
      - username
    IssueEventAttachmentUploadRequestRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    IssueRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          minLength: 1
          maxLength: 1000
        type:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        assigneeIds:
          type: array
          items:
            type: integer
            minimum: 1
          writeOnly: true
        tagIds:
          type: array
          items:
            type: integer
            minimum: 1
          writeOnly: true
        tagNames:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 16
          writeOnly: true
      required:
      - description
      - title
      - type
    LoginRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/UserRead'
      required:
      - accessToken
      - user
    NotificationsPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/NotifyUser'
        nextCursor:
          type: integer
          nullable: true
        hasMore:
          type: boolean
        hasUnread:
          type: boolean
      required:
      - hasMore
      - hasUnread
      - nextCursor
      - results
    NotifyUser:
      type: object
      properties:
        notifyUserId:
          type: integer
          readOnly: true
        notificationId:
          type: integer
          readOnly: true
        type:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        issueId:
          type: integer
          nullable: true
          readOnly: true
        projectId:
          type: integer
          nullable: true
          readOnly: true
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - isRead
      - issueId
      - notificationId
      - notifyUserId
      - projectId
      - readAt
      - type
    NotifyUserRequest:
      type: object
      properties:
        isRead:
          type: boolean
      required:
      - isRead
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
