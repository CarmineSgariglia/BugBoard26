openapi: 3.0.3
info:
  title: BugBoard26 API
  version: 1.0.0-phase1
  description: Canonical Phase 1 API surface for BugBoard26. JWT session revocation
    remains enabled as an intentional security exception.
paths:
  /api/health:
    get:
      operationId: health_retrieve
      tags:
      - Meta
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /api/issues/{issueId}:
    get:
      operationId: issues_retrieve
      parameters:
      - in: path
        name: issueId
        schema:
          type: integer
        description: A unique integer value identifying this issue.
        required: true
      tags:
      - Issues
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
    put:
      operationId: issues_update
      parameters:
      - in: path
        name: issueId
        schema:
          type: integer
        description: A unique integer value identifying this issue.
        required: true
      tags:
      - Issues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
    patch:
      operationId: issues_partial_update
      parameters:
      - in: path
        name: issueId
        schema:
          type: integer
        description: A unique integer value identifying this issue.
        required: true
      tags:
      - Issues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIssueRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIssueRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIssueRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
    delete:
      operationId: issues_destroy
      description: Deletes the issue. No request body is required or documented in
        Phase 1.
      parameters:
      - in: path
        name: issueId
        schema:
          type: integer
        description: A unique integer value identifying this issue.
        required: true
      tags:
      - Issues
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Issue deleted
  /api/issues/{issueId}/assignees/{userId}:
    put:
      operationId: issues_assignees_update
      summary: Assign issue user
      parameters:
      - in: path
        name: issueId
        schema:
          type: integer
        required: true
      - in: path
        name: userId
        schema:
          type: integer
        required: true
      tags:
      - Issues
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Assignee added
    delete:
      operationId: issues_assignees_destroy
      summary: Unassign issue user
      parameters:
      - in: path
        name: issueId
        schema:
          type: integer
        required: true
      - in: path
        name: userId
        schema:
          type: integer
        required: true
      tags:
      - Issues
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Assignee removed
  /api/issues/{issueId}/attachments:
    get:
      operationId: issues_attachments_list
      parameters:
      - in: path
        name: issueId
        schema:
          type: integer
        required: true
      tags:
      - Attachments
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
          description: ''
    post:
      operationId: issues_attachments_create
      parameters:
      - in: path
        name: issueId
        schema:
          type: integer
        required: true
      tags:
      - Attachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueAttachmentCreateRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/issues/{issueId}/attachments/{attachmentId}:
    delete:
      operationId: issues_attachments_destroy
      parameters:
      - in: path
        name: attachmentId
        schema:
          type: integer
        required: true
      - in: path
        name: issueId
        schema:
          type: integer
        required: true
      tags:
      - Attachments
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Attachment deleted
