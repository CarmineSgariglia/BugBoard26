  /api/security/csrf-token:
    get:
      operationId: security_csrf_token_retrieve
      description: Bootstraps the CSRF cookie used by cookie-backed session mutations.
      summary: Get CSRF token
      tags:
      - Security
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFTokenResponse'
          description: ''
  /api/sessions:
    post:
      operationId: sessions_create
      description: Authenticates the user, returns an access token, and sets the refresh
        token in an HTTP-only cookie.
      summary: Create session
      tags:
      - Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - csrfToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/sessions/current:
    delete:
      operationId: sessions_current_destroy
      description: Revokes the current server-side JWT session and clears the refresh
        cookie.
      summary: Logout
      tags:
      - Sessions
      security:
      - csrfToken: []
      - {}
      responses:
        '204':
          description: Logged out
  /api/sessions/current/access-token:
    post:
      operationId: sessions_current_access_token_create
      description: Reads the refresh token from the HTTP-only cookie and returns a
        new access token.
      summary: Refresh access token
      tags:
      - Sessions
      security:
      - csrfToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
