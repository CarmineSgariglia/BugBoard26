          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/issues/{issueId}/events/{eventId}/attachments:
    post:
      operationId: issues_events_attachments_create
      parameters:
      - in: path
        name: eventId
        schema:
          type: integer
        required: true
      - in: path
        name: issueId
        schema:
          type: integer
        required: true
      tags:
