openapi: 3.0.3
info:
  title: BugBoard26 API
  version: 1.0.0-phase1
  description: Canonical Phase 1 API surface for BugBoard26. JWT session revocation
    remains enabled as an intentional security exception.
paths:
  /api/attachments:
    get:
      operationId: attachments_list
      parameters:
      - in: query
        name: issueId
        schema:
          type: integer
      - in: query
        name: updateId
        schema:
          type: integer
      tags:
      - Attachments
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
          description: ''
    post:
      operationId: attachments_create
      description: Phase 1 accepted multipart endpoint for issue-level or event-level
        attachment uploads.
      tags:
      - Attachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentCreateRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/attachments/{attachmentId}:
    delete:
      operationId: attachments_destroy
      parameters:
      - in: path
        name: attachmentId
        schema:
          type: integer
        description: A unique integer value identifying this attachment.
        required: true
      tags:
      - Attachments
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Attachment deleted
  /api/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: Phase 1 compatibility endpoint for CSRF bootstrap.
      summary: Get CSRF token
      tags:
      - Auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFTokenResponse'
          description: ''
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: Phase 1 compatibility endpoint. Returns an access token and sets
        the refresh token in an HTTP-only cookie.
      summary: Create session
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - csrfToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      description: Phase 1 compatibility endpoint. Revokes the current server-side
        JWT session and clears the refresh cookie.
      summary: Logout
      tags:
      - Auth
      security:
      - csrfToken: []
      - {}
      responses:
        '204':
          description: Logged out
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      description: Phase 1 compatibility endpoint for the authenticated user profile.
      summary: Get current user
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
          description: ''
  /api/auth/password/otp/request:
    post:
      operationId: auth_password_otp_request_create
      description: Phase 1 compatibility endpoint for OTP-based password reset.
      summary: Request password reset OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOTPRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordOTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordOTPRequestRequest'
        required: true
      security:
      - csrfToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/password/otp/verify:
    post:
      operationId: auth_password_otp_verify_create
      description: Phase 1 compatibility endpoint for OTP verification.
      summary: Verify password reset OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordOTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordOTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordOTPVerifyRequest'
        required: true
      security:
      - csrfToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordOTPVerifyResponse'
          description: ''
  /api/auth/password/reset:
    post:
      operationId: auth_password_reset_create
      description: Phase 1 compatibility endpoint for OTP-based password reset.
      summary: Reset password with OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - csrfToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
