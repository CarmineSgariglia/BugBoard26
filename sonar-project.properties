sonar.organization=carminesgariglia
sonar.projectKey=CarmineSgariglia_BugBoard26
sonar.projectName=BugBoard26
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.sources=.
sonar.tests=backend/apps/bugboardapi/tests,frontend/src,frontend/tests/e2e
sonar.inclusions=backend/**/*.py,frontend/src/**/*,frontend/*.ts,frontend/*.js,frontend/*.json,frontend/*.html,frontend/*.css,frontend/*.config.js,frontend/*.config.ts,scripts/**/*.sh,.github/workflows/**/*.yml,BrunoTesting/**/*.yml,nginx/**/*.conf,nginx/Dockerfile,docker-compose*.yml,Makefile,README.md,CONTRIBUTING.md
sonar.test.inclusions=backend/apps/bugboardapi/tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/tests/e2e/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/test-results/**,backend/media/**,**/__pycache__/**,**/*.pyc,**/.coverage,backend/apps/bugboardapi/migrations/**,BrunoTesting/.tmp/**,Documentazione/**,nginx/certs/**,**/*.pdf,**/*.jpg,**/*.jpeg,**/*.png,**/*.webp,**/*.psd,**/*.fig,**/.DS_Store,**/.env
sonar.typescript.tsconfigPaths=frontend/tsconfig.json,frontend/tsconfig.app.json

sonar.python.coverage.reportPaths=backend/coverage/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
