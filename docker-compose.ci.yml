services:
  backend:
    user: "0:0"
    environment:
      COVERAGE_FILE: /tmp/.coverage
      MEDIA_ROOT: /tmp/bugboard-media

  bruno:
    build:
      context: .
      dockerfile: BrunoTesting/Dockerfile
    init: true
    working_dir: /workspace/BrunoTesting/BugBoard
    volumes:
      - ./:/workspace:ro
      - ./BrunoTesting/.tmp:/workspace/BrunoTesting/.tmp
    networks:
      - bugboard_net

  frontend-test:
    build:
      context: .
      dockerfile: frontend/Dockerfile.ci
      target: vitest
    init: true
    working_dir: /workspace/frontend
    networks:
      - bugboard_net
