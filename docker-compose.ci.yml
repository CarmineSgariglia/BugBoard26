services:
  bruno:
    build:
      context: .
      dockerfile: BrunoTesting/Dockerfile
    init: true
    working_dir: /workspace/BrunoTesting/BugBoard
    volumes:
      - ./:/workspace:ro
      - ./.tmp:/workspace/.tmp
    networks:
      - bugboard_net

  frontend-test:
    build:
      context: .
      dockerfile: frontend/Dockerfile.ci
      target: vitest
    init: true
    working_dir: /workspace/frontend
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    networks:
      - bugboard_net

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.ci
      target: playwright
    init: true
    working_dir: /workspace/frontend
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:5173
      CI: "true"
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - bugboard_net

volumes:
  frontend_node_modules:
