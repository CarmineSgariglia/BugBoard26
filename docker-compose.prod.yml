services:
  db:
    ports: []

  backend:
    ports: []
    volumes: []
    environment:
      DEBUG: "False"

  frontend:
    ports: []
    volumes: []
    environment:
      NODE_ENV: production
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
    command: >
      sh -c "npm ci && npm run build && npm run preview -- --host 0.0.0.0 --port 5173"

  nginx:
    profiles: []
