services:
  db:
    ports: !override []

  redis:
    profiles:
      - scale-ready

  backend:
    ports: !override []
    volumes: !override []
    depends_on: !override
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      CORS_ALLOW_ALL_ORIGINS: "False"
      SINGLE_NODE_RUNTIME: "True"
      CACHE_BACKEND: locmem
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "12"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/admin/login/', headers={'X-Forwarded-Proto': 'https', 'Host': 'backend'}); urllib.request.urlopen(req, timeout=3)\" >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    profiles:
      - dev-only

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx/default.conf/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O - https://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bugboard_net
