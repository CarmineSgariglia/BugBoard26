services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bugboard_net

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    env_file: .env
    # Rimosso healthcheck per evitare il blocco del deploy
    depends_on:
      - db
    networks:
      - bugboard_net

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./nginx/default.conf/production.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/usr/share/nginx/django-static:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend # Ora aspetta solo l'avvio, non lo stato 'healthy'
    networks:
      - bugboard_net

volumes:
  postgres_data:
  staticfiles:

networks:
  bugboard_net:
    driver: bridge
