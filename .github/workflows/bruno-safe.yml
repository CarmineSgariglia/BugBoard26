name: Bruno Safe Suite

on:
  push:
    paths:
      - "BrunoTesting/**"
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "BrunoTesting/env/**"
      - "scripts/bootstrap_bruno_bugboard_ci.sh"
      - ".github/workflows/bruno-safe.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  bruno-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create CI env file
        run: cp BrunoTesting/env/bruno-safe.ci.env .env

      - name: Start database and backend
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build db backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Bootstrap Bruno data
        run: ./scripts/bootstrap_bruno_bugboard_ci.sh

      - name: Create Bruno CI environment
        run: |
          mkdir -p BrunoTesting/.tmp/bruno BrunoTesting/.tmp/bruno-reports
          cat > BrunoTesting/.tmp/bruno/local_dev_ci.json <<'EOF'
          {
            "name": "local_dev_ci",
            "variables": [
              { "name": "baseURL", "value": "http://backend:8000/api", "enabled": true },
              { "name": "email", "value": "dev@test.it", "enabled": true },
              { "name": "password", "value": "StrongPass123!", "enabled": true },
              { "name": "invalid_id", "value": "999999", "enabled": true },
              { "name": "invalid_token", "value": "abc.def.ghi", "enabled": true },
              { "name": "access_token", "value": "", "enabled": true }
            ]
          }
          EOF

      - name: Run Bruno safe suite
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm bruno run \
            00_Setup/GetCSRF.yml \
            00_Setup/Login.yml \
            API/01_Auth/Me/Me_auth.yml \
            API/02_Users/00_Setup/Set_target_user.yml \
            API/03_Projects/00_Setup/Set_project_context.yml \
            API/03_Projects/ProjectIssues/Issues_list_auth.yml \
            API/04_Issues/00_Setup/Set_issue_context.yml \
            API/04_Issues/Get/Get_auth.yml \
            API/04_Issues/Updates/Updates_get.yml \
            API/04_Issues/Suggestions/Suggestions_get.yml \
            API/05_Notifications/00_Setup/Set_notification_context.yml \
            API/05_Notifications/List/List_auth.yml \
            --env-file /workspace/BrunoTesting/.tmp/bruno/local_dev_ci.json \
            --reporter-junit /workspace/BrunoTesting/.tmp/bruno-reports/bruno-safe.junit.xml \
            --reporter-html /workspace/BrunoTesting/.tmp/bruno-reports/bruno-safe.html

      - name: Upload Bruno reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bruno-safe-reports
          path: BrunoTesting/.tmp/bruno-reports

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color db backend

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
