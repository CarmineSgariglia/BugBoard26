name: SonarCloud Analysis

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create CI env file
        run: cp BrunoTesting/env/bruno-safe.ci.env .env

      - name: Prepare coverage directories
        run: |
          mkdir -p backend/coverage frontend/coverage
          chmod 0777 backend/coverage frontend/coverage

      - name: Start database and redis
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build db redis

      - name: Wait for database health
        run: |
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T db pg_isready -U bugboard -d bugboard >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs db
          exit 1

      - name: Wait for redis health
        run: |
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs redis
          exit 1

      - name: Build backend test image
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build backend

      - name: Run backend tests with coverage
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm backend sh -lc '
            mkdir -p coverage
            export COVERAGE_RCFILE=.coveragerc
            coverage erase
            coverage run manage.py test apps.bugboardapi.tests -v 2
            test_exit=$?
            coverage report -m || true
            coverage xml -o coverage/coverage.xml || true
            exit $test_exit
          '

      - name: Build frontend test image
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build frontend-test

      - name: Run frontend build
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm frontend-test npm run build

      - name: Run frontend unit and integration tests with coverage
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm frontend-test npm run test:coverage

      - name: Normalize backend coverage for SonarCloud
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("backend/coverage/coverage.xml")
          root = tree.getroot()

          sources = root.find("sources")
          if sources is not None:
              sources.clear()
              source = ET.SubElement(sources, "source")
              source.text = "."

          for cls in root.findall(".//class"):
              filename = cls.get("filename", "")
              if filename.startswith("bugboardapi/"):
                  cls.set("filename", f"backend/apps/{filename}")
              elif filename:
                  cls.set("filename", f"backend/config/{filename}")

          tree.write("/tmp/coverage-sonar.xml", encoding="utf-8", xml_declaration=True)
          PY

      - name: Normalize frontend coverage for SonarCloud
        run: |
          sed 's#^SF:src/#SF:frontend/src/#; s#^SF:/workspace/frontend/src/#SF:frontend/src/#' \
            frontend/coverage/lcov.info > /tmp/lcov-sonar.info

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=/tmp/coverage-sonar.xml
            -Dsonar.javascript.lcov.reportPaths=/tmp/lcov-sonar.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Sonar coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sonar-artifacts
          path: |
            backend/coverage
            frontend/coverage

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color db redis

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
